[package]
name = "cloudy-af"
version = "1.15.3"
description = "Configuration Tool for Vape Battery Mods with Arcticfox Firmware"
authors = ["Sebastian Raff", "OneButtFarting"]
license = "GPL-3.0"
repository = "https://github.com/VernaUpon74/cloudy-af"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "cloudy_af_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
tauri-plugin-shell = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["process", "io-util", "sync", "rt", "macros"] }
log = "0.4"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
thiserror = "2.0.20"
quick-xml = "0.37"
hidapi = "2.6.6"
aes = "0.8"
getrandom = "0.2"

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Firmware Editor</title>
    <style>
        #patch-list { width: 100%; }
        #patch-list td, #patch-list th { padding: 4px 8px; text-align: left; }
        #patch-details { padding: 12px; }
        .status-applied { color: #0a0; }
        .status-pending { color: #888; }
    </style>
</head>
<body>
<div class="window">
    <header class="toolbar toolbar-header">
        <h1 class="title">Firmware Editor</h1>
    </header>

    <div class="toolbar toolbar-actions" style="padding: 8px;">
        <button id="open-firmware" class="btn btn-default">Open Firmware</button>
        <button id="save-firmware" class="btn btn-default">Save</button>
        <button id="save-as-firmware" class="btn btn-default">Save As</button>
        <span id="fw-status" style="margin-left: 12px; line-height: 26px;">No firmware loaded</span>
    </div>

    <div class="tab-group">
        <div class="tab-item active" data-tab="patches">Patches</div>
        <div class="tab-item" data-tab="images">Images</div>
        <div class="tab-item" data-tab="strings">Strings</div>
        <div class="tab-item" data-tab="resourcepacks">Resource Packs</div>
    </div>

    <div class="window-content">
        <div id="tab-patches">
            <table id="patch-list">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Version</th>
                        <th>Author</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
            <div id="patch-details">
                <p>Select a patch to view details.</p>
            </div>
        </div>
        <div id="tab-images" style="display: none;">
            <p>Image editor coming soon.</p>
        </div>
        <div id="tab-strings" style="display: none;">
            <p>String editor coming soon.</p>
        </div>
        <div id="tab-resourcepacks" style="display: none;">
            <p>Resource pack importer coming soon.</p>
        </div>
    </div>
</div>
<script type="module" src="/src/renderer-firmware.js"></script>
</body>
</html>
